steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - job_runner/Dockerfile
      - -t
      - us-docker.pkg.dev/$PROJECT_ID/douyin/job-runner:latest
      - .

images:
  - us-docker.pkg.dev/$PROJECT_ID/douyin/job-runner:latest

options:
  machineType: E2_HIGHCPU_8
timeout: 1200s
