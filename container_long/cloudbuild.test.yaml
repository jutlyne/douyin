steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - container_long/Dockerfile
      - -t
      - us-docker.pkg.dev/$PROJECT_ID/douyin/long-worker:test
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - container_long/Dockerfile.assembler
      - -t
      - us-docker.pkg.dev/$PROJECT_ID/douyin/long-assembler:test
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - container_long/Dockerfile.coordinator
      - -t
      - us-docker.pkg.dev/$PROJECT_ID/douyin/long-coordinator:test
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - long_job_runner/Dockerfile
      - -t
      - us-docker.pkg.dev/$PROJECT_ID/douyin/long-runner:test
      - .

images:
  - us-docker.pkg.dev/$PROJECT_ID/douyin/long-worker:test
  - us-docker.pkg.dev/$PROJECT_ID/douyin/long-assembler:test
  - us-docker.pkg.dev/$PROJECT_ID/douyin/long-coordinator:test
  - us-docker.pkg.dev/$PROJECT_ID/douyin/long-runner:test

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
timeout: 3600s
